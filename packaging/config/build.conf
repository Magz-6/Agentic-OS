# AgenticOS v0.1 Alpha — ISO Build Configuration
# Status: VALIDATED CONFIGURATION BASE — READY FOR FINAL BUILD VALIDATION
# Architecture: Candidate B — Ubuntu 24.04.5 LTS + Casper/OverlayFS + Custom xorriso/GRUB

# -----------------------------------------------------------------------------
# 1. Project & Target ISO Metadata
# -----------------------------------------------------------------------------

PROJECT_NAME="AgenticOS"
PROJECT_VERSION="v0.1-Alpha"
ISO_NAME="AgenticOS-v0.1-Alpha.iso"
VOLUME_ID="AGENTICOS_V01"

# -----------------------------------------------------------------------------
# 2. Upstream Live-Media Source
# -----------------------------------------------------------------------------

# Official Release: Ubuntu 24.04.5 LTS (Noble Numbat)
UPSTREAM_ISO_NAME="ubuntu-24.04.5-live-server-amd64.iso"
UPSTREAM_ISO_URL="https://releases.ubuntu.com/24.04/ubuntu-24.04.5-live-server-amd64.iso"
UPSTREAM_SHA256="97f3d7ffb032c3eb3b23d2c8be9cc76e60c2c1f2c0146ba5ba9fe01cafae0fd8"

# Verified Live Components
# Kernel: 6.8.0-139-generic
KERNEL_FILE="vmlinuz"
INITRD_FILE="initrd"

# -----------------------------------------------------------------------------
# 3. Base SquashFS Artifacts
# -----------------------------------------------------------------------------

# Official/Base Ubuntu 24.04.5 LTS SquashFS
# Default target can be overridden by TARGET_BASE_SQUASHFS.
BASE_SQUASHFS_NAME="${TARGET_BASE_SQUASHFS:-ubuntu-server-minimal.squashfs}"
BASE_SQUASHFS_SHA256="bd1ce4815bb1988b171cc863b63ac367311af9a2f30c9b13a2ddddee7b89a5ea"

# GUI Base SquashFS
# Contains Ubuntu 24.04.5 LTS + Xorg/Openbox/fbdev and native AgenticOS GTK GUI dependencies.
GUI_SQUASHFS_NAME="ubuntu-server-gui.squashfs"
GUI_SQUASHFS_SHA256="85e03056e776bfc8cfa7c6f280d7f6e83c15d2abf0628c17984bca35f2766a7f"

# Casper Live Media SquashFS image.
# This value must match the SquashFS filename placed under /casper/.
LIVE_SQUASHFS_NAME=""

# -----------------------------------------------------------------------------
# 4. Casper Medium UUID
# -----------------------------------------------------------------------------

# Extracted from the verified initrd /conf/uuid.conf.
# Must correspond to the initrd used for the final ISO.
CASPER_UUID="50c98eb4-4c0f-4c1a-82d2-4234cf187d50"

# -----------------------------------------------------------------------------
# 5. Directory Layout
# -----------------------------------------------------------------------------

# All paths are relative to the AgenticOS project root.

PACKAGING_DIR="packaging"
CONFIG_DIR="${PACKAGING_DIR}/config"
SCRIPTS_DIR="${PACKAGING_DIR}/scripts"
STAGING_DIR="${PACKAGING_DIR}/staging"
OUTPUT_DIR="${PACKAGING_DIR}/output"

# Intermediate staging paths
ISO_ROOT="${STAGING_DIR}/iso_root"
SQUASHFS_ROOT="${STAGING_DIR}/squashfs_root"

# -----------------------------------------------------------------------------
# 6. Architectural Governance & Service Integration Contracts
# -----------------------------------------------------------------------------

# System-service lifecycle and installation contracts remain
# UNDEFINED / BLOCKED pending team approval.
#
# Automatic service injection, systemd symlinking, and preset enablement
# remain disabled by default.
INSTALL_SYSTEMD_SERVICE=1
ENABLE_SYSTEMD_SERVICE=1

# -----------------------------------------------------------------------------
# 7. AgenticOS Installation Target
# -----------------------------------------------------------------------------

# Provisional user-space component installation directory.
# Final service/component contracts may override this location.
PROPOSED_INSTALL_DIR="/opt/agenticos"

# -----------------------------------------------------------------------------
# 8. Build Target Selection
# -----------------------------------------------------------------------------

# Supported targets:
#   minimal -> Ubuntu server/minimal base
#   gui     -> Ubuntu GUI/Desktop base
#
# Default remains minimal unless explicitly overridden.
BUILD_TARGET="${BUILD_TARGET:-minimal}"

case "${BUILD_TARGET}" in
    minimal)
        TARGET_SQUASHFS="${BASE_SQUASHFS_NAME}"
        ;;
    gui)
        TARGET_SQUASHFS="${GUI_SQUASHFS_NAME}"
        ;;
    *)
        echo "ERROR: Unsupported BUILD_TARGET='${BUILD_TARGET}'"
        echo "Supported targets: minimal, gui"
        return 1 2>/dev/null || exit 1
        ;;
esac

# -----------------------------------------------------------------------------
# 9. Final Live-Media Artifact
# -----------------------------------------------------------------------------

# The build system should copy TARGET_SQUASHFS into /casper/ using
# LIVE_SQUASHFS_NAME before GRUB/xorriso assembly.

# For GUI builds, invoke with:
#   BUILD_TARGET=gui
#
# For minimal builds, invoke with:
#   BUILD_TARGET=minimal
