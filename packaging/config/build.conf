# -----------------------------------------------------------------------------
PROJECT_NAME="AgenticOS"
PROJECT_VERSION="v0.1-Alpha"
ISO_NAME="AgenticOS-v0.1-Alpha.iso"
VOLUME_ID="AGENTICOS_V01"

# -----------------------------------------------------------------------------
# 2. Upstream Live-Media Source (Empirically Verified via GPG & SHA256)
# -----------------------------------------------------------------------------
# Official Release: Ubuntu 24.04.5 LTS (Noble Numbat)
