# AgenticOS v0.1 Alpha — GRUB 2 Configuration Template
# Live-boot configuration using Casper / OverlayFS

set default="0"
set timeout=5

# -----------------------------------------------------------------------------
# Graphical Terminal Setup
# -----------------------------------------------------------------------------

insmod all_video
insmod font

if loadfont /boot/grub/fonts/unicode.pf2 ; then
    insmod gfxterm
    set gfxmode=auto
    terminal_output gfxterm
fi

# -----------------------------------------------------------------------------
# Main Live Boot Entry
# -----------------------------------------------------------------------------

menuentry "AgenticOS v0.1 Alpha (Live Environment)" {
    set gfxpayload=keep

    linux /casper/vmlinuz \
        boot=casper \
        layerfs-path=${LIVE_SQUASHFS_NAME} \
        quiet splash \
        plymouth.theme=agenticos \
        ---

    initrd /casper/initrd
}

# -----------------------------------------------------------------------------
# Safe Graphics / Compatibility Fallback Entry
# -----------------------------------------------------------------------------

menuentry "AgenticOS v0.1 Alpha (Safe Graphics)" {
    set gfxpayload=keep

    linux /casper/vmlinuz \
        boot=casper \
        layerfs-path=${LIVE_SQUASHFS_NAME} \
        nomodeset \
        quiet splash \
        plymouth.theme=agenticos \
        ---

    initrd /casper/initrd
}

# -----------------------------------------------------------------------------
# Live Debug & Serial Console Entry
# -----------------------------------------------------------------------------

menuentry "AgenticOS v0.1 Alpha (Debug & Serial Console)" {
    set gfxpayload=keep

    linux /casper/vmlinuz \
        boot=casper \
        layerfs-path=${LIVE_SQUASHFS_NAME} \
        console=ttyS0 \
        console=tty1 \
        debug verbose \
        ---

    initrd /casper/initrd
}