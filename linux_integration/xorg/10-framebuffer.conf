# AgenticOS Xorg Framebuffer Fallback Configuration
# Layer 12: Linux Integration Boundary & Layer 9: Applications / Desktop
# Provides non-KMS framebuffer fallback via /dev/fb0 when DRM (/dev/dri/card0) is unavailable.

Section "Device"
    Identifier  "FramebufferFallback"
    Driver      "fbdev"
    Option      "fbdev" "/dev/fb0"
EndSection

Section "Screen"
    Identifier  "FramebufferScreen"
    Device      "FramebufferFallback"
EndSection

Section "ServerLayout"
    Identifier  "FramebufferLayout"
    Screen      "FramebufferScreen"
EndSection
